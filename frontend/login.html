<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falls Car - Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header class="header">
        <div class="headerInner">
            <a href="index.html" class="headerLogo">Falls <span>Car</span></a>
            <a href="index.html" class="btn btnOutline">← Voltar ao Catálogo</a>
        </div>
    </header>

    <main class="main">
        <section class="auth">
            <div class="authCard">
                <h1 class="authTitulo">Entrar na sua conta</h1>
                <p class="authSubtitulo">Bem-vindo de volta!</p>

                <div id="mensagemRetorno" class="oculto"></div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Sua senha">
                </div>

                <button class="btn btnPrimary btnFull" id="btnLogin">Entrar</button>

                <p class="authLink">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Falls Car. Todos os direitos reservados.</p>
    </footer>

    <script src="assets/js/login.js"></script>
</body>
</html>
