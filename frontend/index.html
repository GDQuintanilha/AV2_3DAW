<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Falls Car - Locadora de Veículos</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header class="header">
        <div class="header__inner">
            <a href="index.html" class="header__logo">Falls <span>Car</span></a>
            <div class="header__search">
                <input type="text" id="campoBusca" placeholder="Buscar por modelo ou categoria...">
            </div>
            <a href="checkout.html" class="btn btn--outline">Fazer Reserva</a>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <div class="hero__content">
                <h1>Alugue com quem entende do assunto</h1>

            </div>
        </section>

        <section class="vitrine">
            <div class="vitrine__inner">
                <div id="catalogoContainer"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Falls Car. Todos os direitos reservados.</p>
    </footer>

    <script src="assets/js/main.js"></script>

</html>
