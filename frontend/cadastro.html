<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falls Car - Cadastro</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header class="header">
        <div class="headerInner">
            <a href="index.html" class="headerLogo">Falls <span>Car</span></a>
            <a href="index.html" class="btn btnOutline">← Voltar ao Catálogo</a>
        </div>
    </header>

    <main class="main">
        <section class="auth">
            <div class="authCard">
                <h1 class="authTitulo">Criar conta</h1>
                <p class="authSubtitulo">Preencha os dados abaixo para se cadastrar.</p>

                <div id="mensagemRetorno" class="oculto"></div>

                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Seu nome completo">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
                </div>

                <div class="campo">
                    <label for="dataNasc">Data de Nascimento</label>
                    <input type="date" id="dataNasc">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Mínimo 6 caracteres">
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <input type="password" id="confirmarSenha" placeholder="Repita a senha">
                </div>

                <button class="btn btnPrimary btnFull" id="btnCadastrar">Criar Conta</button>

                <p class="authLink">Já tem conta? <a href="login.html">Entrar</a></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Falls Car. Todos os direitos reservados.</p>
    </footer>

    <script src="assets/js/cadastro.js"></script>
</body>
</html>
